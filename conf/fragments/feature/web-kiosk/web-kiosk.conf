DISTRO_FEATURES:append = " x11"
EXTRA_IMAGE_FEATURES:append = " x11-base"

# xserver-xorg has important recommended recipes
# missing xkeyboard-config would prevent Xorg from starting up
NO_RECOMMENDATIONS ?= "0"

# Enable xserver-nodm service
SYSTEMD_AUTO_ENABLE:pn-xserver-nodm-init = "enable"
# Disable dpms and screen saver
PACKAGECONFIG:remove:pn-xserver-nodm-init = "blank"
# Hide pointer cursor
#PACKAGECONFIG:append:pn-xserver-nodm-init = " nocursor"

IMAGE_INSTALL:append = " at-spi2-core \
                         epiphany \
                         onboard \
                         ttf-dejavu-sans \
                         unclutter-xfixes \
                         wr-kiosk \
                         xdotool \
                       "
