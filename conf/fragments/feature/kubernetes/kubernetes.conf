DISTRO_FEATURES:append = " virtualization k8s"

# wrlinux additional kubernetes configuration path
# The config fragment is set according to cmd/kubeadm/app/util/system/types_unix.go in kubernetes source
EXTRA_KERNEL_FILES =. "${LAYER_PATH_wrlinux}/conf/fragments/feature/kubernetes/files:"
EXTRA_KERNEL_SRC_URI:append = " file://wr-kubernetes.cfg"
IMAGE_INSTALL:append = " packagegroup-oci packagegroup-containerd kubernetes kubernetes-misc"
