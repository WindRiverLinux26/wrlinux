KERNEL_FEATURES:append = " features/lxc/lxc-enable.scc \
                    features/netfilter/netfilter.scc \
                    features/overlayfs/overlayfs.cfg"

# wrlinux additional podman configuration path
EXTRA_KERNEL_FILES =. "${LAYER_PATH_wrlinux}/conf/fragments/feature/podman/files:"
EXTRA_KERNEL_SRC_URI:append = " file://podman.cfg"

# remove rconflicts
PODMAN_FEATURES:remove = "docker"

CONTAINER_PROFILE = "podman"
IMAGE_INSTALL:append = " podman"
