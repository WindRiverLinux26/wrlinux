# enable kernel patches / configure options
KERNEL_FEATURES += "features/kvm/qemu-kvm-enable.scc"
KERNEL_FEATURES += "features/netfilter/netfilter.scc"

# WRLinux additional libvirt configuration path
EXTRA_KERNEL_FILES =. "${LAYER_PATH_wrlinux}/wrlinux-distro/templates/feature/libvirt/files:"
EXTRA_KERNEL_SRC_URI += "file://net-act.cfg"
