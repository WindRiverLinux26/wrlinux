# enable kernel patches / configure options
KERNEL_FEATURES:append = " features/kvm/qemu-kvm-enable.scc"
KERNEL_FEATURES:append = " features/netfilter/netfilter.scc"

# WRLinux additional libvirt configuration path
EXTRA_KERNEL_FILES =. "${LAYER_PATH_wrlinux}/wrlinux-distro/templates/feature/libvirt/files:"
EXTRA_KERNEL_SRC_URI:append = " file://net-act.cfg"
IMAGE_INSTALL:append = " \
    qemu \
    libvirt \
    libvirt-libvirtd \
    libvirt-virsh \
    socat \
    lxc \
"
