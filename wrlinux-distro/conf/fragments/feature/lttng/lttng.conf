# configure the kernel for lttng
KERNEL_FEATURES:append = " features/lttng/lttng.scc"
IMAGE_INSTALL:append = " lttng-modules"
IMAGE_INSTALL:append = " lttng-tools"
IMAGE_INSTALL:append = " lttng-ust"
IMAGE_INSTALL:append = " babeltrace2"
IMAGE_INSTALL:append = " python3-core"

IMAGE_INSTALL:append = " ${@bb.utils.contains('DISTRO_FEATURES', 'api-documentation', 'lttng-tools-doc', '', d)}"

# To avoid build warnings, add this explicitly only if it would not get pulled
# in automatically.  Historically, we have provided this all the time.
#
IMAGE_INSTALL:append = " ${@bb.utils.contains('IMAGE_FEATURES','dbg-pkgs','','lttng-ust-dbg',d)}"

