# Use recipe of wrlinux-image-initramfs to build initramfs image
INITRAMFS_IMAGE ?= "wrlinux-image-initramfs"

# use for arm boards
INITRAMFS_FSTYPES:aarch64 += "cpio.gz.u-boot"
IMAGE_INSTALL_INITRAMFS:append = "  \
                            initramfs-nfs-boot \
                            nfs-utils-client \
                            os-release-initrd \
"
