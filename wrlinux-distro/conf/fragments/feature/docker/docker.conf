DISTRO_FEATURES:append = " virtualization"

# Ensure required kernel configs
KERNEL_FEATURES:append = " features/lxc/lxc-enable.scc"
KERNEL_FEATURES:append = " features/netfilter/netfilter.scc"
KERNEL_FEATURES:append = " cfg/docker.scc"

# wrlinux additional docker configuration path
EXTRA_KERNEL_FILES =. "${LAYER_PATH_wrlinux}/templates/feature/docker-moby/files:"
EXTRA_KERNEL_SRC_URI:append = " file://docker-aux.cfg"
# add install lxc user code
#
IMAGE_INSTALL:append = " docker docker-compose"
IMAGE_INSTALL:append = " ${@bb.utils.contains('PACKAGE_CLASSES','package_deb','containerd-opencontainers','virtual-containerd',d)}"

